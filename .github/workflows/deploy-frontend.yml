name: Deploy Frontend to GitHub Pages

on:
  push:
    # Only main deploys. The dormant 'frontend' branch used to be able to publish here too,
    # which meant whichever branch was pushed last silently became the live site.
    branches: [ main ]
    # This workflow file is included so that changes to the build itself redeploy. Without it,
    # editing the build without touching frontend/ leaves the published bundle stale.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Build frontend
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Deployment target. Unset in production, which falls back to the production values
          # in astro.config.mjs. The staging mirror sets these as repository variables.
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          # Powers the in-page scraper controls.
          #
          # Note that Astro inlines every PUBLIC_* variable into the client bundle at build
          # time, so whatever token is set here is readable by any visitor. Use a fine-grained
          # token limited to this repository with only "Actions: read and write" — a classic
          # ghp_ token carries account-wide scope, and a workflow-scoped one can be used to
          # print this repository's other secrets.
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
          # Which repository the controls drive. Unset in production, which falls back to
          # BD4L/Breaches; the staging mirror points these at itself.
          PUBLIC_GITHUB_OWNER: ${{ vars.PUBLIC_GITHUB_OWNER }}
          PUBLIC_GITHUB_REPO: ${{ vars.PUBLIC_GITHUB_REPO }}
        run: |
          cd frontend
          npm run build
          # Disable Jekyll processing
          touch dist/.nojekyll
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
